[package]
name = "cloud-portable-s3vectors"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Language-independent S3 API compatibility test vectors, parsed and importable per feature area, plus the deterministic test-data generator"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/cloud-portable/s3vectors"
keywords = ["s3", "test-vectors", "compatibility", "conformance", "sigv4"]
categories = ["development-tools::testing"]
include = ["src/**", "vectors/**", "README.md", "LICENSE.md"]

[features]
default = ["datagen"]
datagen = ["dep:sha2", "dep:sha1", "dep:md-5", "dep:crc", "dep:base64"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
crc = { version = "3.2", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
base64 = "0.22"
serde_json = "1"

# The corpus datagen test hashes ~2 GiB; unoptimized crypto makes it crawl.
[profile.test]
opt-level = 2
